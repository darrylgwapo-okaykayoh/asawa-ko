<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff5ed">
  <title>A Birthday Question for You</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #593343;
      --berry: #a63d62;
      --rose: #d96f8c;
      --paper: #fffaf1;
      --gold: #efc779;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 28px 18px;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 12% 18%, rgba(255,255,255,.9) 0 2px, transparent 3px),
        radial-gradient(ellipse at 82% 72%, rgba(255,255,255,.8) 0 2px, transparent 3px),
        linear-gradient(145deg, #fff5ed 0%, #fde8ed 52%, #f7e8d7 100%);
      background-size: 46px 46px, 58px 58px, auto;
      font-family: Georgia, "Times New Roman", serif;
    }

    .garden {
      position: fixed;
      z-index: 0;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .tulip {
      position: absolute;
      bottom: -6px;
      left: var(--x);
      width: 64px;
      height: var(--height);
      transform: scaleY(0);
      transform-origin: bottom center;
      animation: grow 2.2s cubic-bezier(.2, .8, .2, 1) var(--delay) forwards;
      filter: drop-shadow(0 5px 8px rgba(52, 94, 75, .12));
    }

    .stem {
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 5px;
      height: calc(100% - 34px);
      transform: translateX(-50%);
      border-radius: 999px;
      background: linear-gradient(90deg, #6b9b70, #91b987 55%, #5f8c67);
    }

    .leaf {
      position: absolute;
      bottom: 26%;
      width: 30px;
      height: 15px;
      border-radius: 100% 0 100% 0;
      background: linear-gradient(145deg, #a5c78b, #719e72);
    }

    .leaf-one {
      left: 4px;
      transform: rotate(12deg);
    }

    .leaf-two {
      right: 3px;
      bottom: 43%;
      transform: scaleX(-1) rotate(12deg);
    }

    .bloom {
      position: absolute;
      top: 0;
      left: 50%;
      width: 48px;
      height: 47px;
      transform: translateX(-50%);
    }

    .petal {
      position: absolute;
      bottom: 0;
      width: 25px;
      height: 36px;
      border-radius: 55% 55% 42% 42%;
      background: var(--bloom);
      box-shadow: inset 0 0 9px rgba(255, 255, 255, .58);
    }

    .petal-left {
      left: 1px;
      transform: rotate(-21deg);
    }

    .petal-right {
      right: 1px;
      transform: rotate(21deg);
    }

    .petal-center {
      z-index: 1;
      left: 12px;
      width: 24px;
      height: 46px;
      border-radius: 55% 55% 48% 48%;
    }

    .scene {
      position: relative;
      z-index: 1;
      width: min(100%, 620px);
      text-align: center;
      isolation: isolate;
    }

    .sparkle {
      position: absolute;
      z-index: -1;
      color: rgba(166, 61, 98, .36);
      font-size: 24px;
      animation: twinkle 2.8s ease-in-out infinite alternate;
    }

    .sparkle-one { top: 21%; left: 8%; }
    .sparkle-two { top: 31%; right: 7%; animation-delay: .8s; }
    .sparkle-three { bottom: 10%; left: 17%; animation-delay: 1.3s; }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--berry);
      font-family: Arial, sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .24em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 560px;
      margin: 0 auto 30px;
      font-size: clamp(36px, 8vw, 58px);
      font-weight: 400;
      line-height: 1.12;
      text-wrap: balance;
    }

    h1 em {
      color: var(--berry);
      font-weight: 400;
    }

    .envelope-button {
      display: block;
      width: min(100%, 480px);
      margin: 0 auto;
      padding: 0 0 22px;
      border: 0;
      background: transparent;
      color: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .envelope {
      position: relative;
      display: block;
      width: 100%;
      aspect-ratio: 1.72;
      overflow: visible;
      border-radius: 8px 8px 14px 14px;
      background: linear-gradient(145deg, #93c5f2, #5f9fe0);
      box-shadow: 0 24px 55px rgba(48, 91, 137, .22), 0 5px 12px rgba(48, 91, 137, .1);
      perspective: 800px;
      animation: envelope-float 2.8s ease-in-out infinite;
    }

    .letter {
      position: absolute;
      z-index: 1;
      left: 8%;
      bottom: 5%;
      width: 84%;
      height: 83%;
      display: grid;
      place-content: center;
      padding: 20px;
      border-radius: 5px;
      background: var(--paper);
      box-shadow: 0 3px 12px rgba(75, 38, 51, .12);
      transition: transform .75s cubic-bezier(.2,.8,.2,1), bottom .75s ease, z-index 0s .2s;
    }

    .letter h1 {
      max-width: 290px;
      margin: 0;
      color: #294864;
      font-size: clamp(19px, 3.6vw, 25px);
      font-weight: 400;
      line-height: 1.25;
      letter-spacing: -.025em;
      text-wrap: balance;
    }

    .letter h1 .intro {
      display: block;
      margin-bottom: 5px;
      color: #71869a;
      font-size: .76em;
      font-style: normal;
      letter-spacing: .035em;
    }

    .letter h1 em {
      display: block;
      color: #477fb3;
      font-size: 1.04em;
      font-style: italic;
      font-weight: 400;
    }

    .letter small {
      display: block;
      margin-top: 14px;
      color: #8394a3;
      font-family: Arial, sans-serif;
      font-size: 10px;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .letter small::before {
      content: "";
      display: block;
      width: 26px;
      height: 1px;
      margin: 0 auto 9px;
      background: var(--gold);
    }

    .back-fold {
      position: absolute;
      z-index: 2;
      inset: 0;
      background: #79afe8;
      clip-path: polygon(0 0, 100% 0, 50% 58%);
    }

    .front-left,
    .front-right,
    .front-bottom {
      position: absolute;
      z-index: 3;
      inset: 0;
    }

    .front-left {
      background: #76aee8;
      clip-path: polygon(0 0, 52% 56%, 0 100%);
    }

    .front-right {
      background: #629cda;
      clip-path: polygon(100% 0, 48% 56%, 100% 100%);
    }

    .front-bottom {
      background: linear-gradient(160deg, #8dbded, #619bd8);
      clip-path: polygon(0 100%, 50% 43%, 100% 100%);
    }

    .flap {
      position: absolute;
      z-index: 4;
      inset: 0;
      background: linear-gradient(160deg, #a5cff4, #78afe8);
      clip-path: polygon(0 0, 100% 0, 50% 60%);
      transform-origin: top center;
      transition: transform .65s ease, z-index 0s .3s;
      backface-visibility: hidden;
    }

    .seal {
      position: absolute;
      z-index: 5;
      top: 52%;
      left: 50%;
      display: grid;
      width: 48px;
      height: 48px;
      place-items: center;
      transform: translate(-50%, -50%) rotate(-45deg);
      border: 2px solid rgba(255, 255, 255, .72);
      border-radius: 50% 50% 50% 8px;
      background: #356fae;
      color: #fff3c8;
      font-size: 20px;
      box-shadow: 0 4px 10px rgba(101, 42, 63, .22);
      transition: opacity .25s ease, transform .35s ease;
    }

    .seal span {
      transform: rotate(45deg);
    }

    .envelope-button:hover .envelope {
      box-shadow: 0 28px 60px rgba(48, 91, 137, .28), 0 5px 12px rgba(48, 91, 137, .1);
    }

    .envelope-button:focus-visible {
      outline: 3px solid var(--berry);
      outline-offset: 7px;
      border-radius: 12px;
    }

    .envelope-button.open .flap {
      z-index: 0;
      transform: rotateX(180deg);
      transition: transform .65s ease, z-index 0s;
    }

    .envelope-button.open .letter {
      bottom: 20%;
      transform: translateY(-8%);
      z-index: 4;
    }

    .envelope-button.open .seal {
      opacity: 0;
      transform: translate(-50%, -50%) rotate(-45deg) scale(.5);
    }

    .tap-hint {
      display: inline-block;
      margin-top: 17px;
      color: #8c6271;
      font-family: Arial, sans-serif;
      font-size: 12px;
      letter-spacing: .08em;
      transition: opacity .3s ease;
    }

    .envelope-button.open .tap-hint {
      opacity: 0;
    }

    .answer {
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transition: opacity .45s ease, max-height .6s ease, margin .6s ease;
    }

    .answer.visible {
      max-height: 190px;
      margin-top: 6px;
      opacity: 1;
    }

    .answer p {
      margin: 0 0 16px;
      color: #775360;
      font-size: 17px;
    }

    .choices {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .choice {
      display: inline-block;
      min-width: 136px;
      padding: 12px 20px;
      border: 1px solid var(--berry);
      border-radius: 999px;
      background: var(--berry);
      color: white;
      font-family: Arial, sans-serif;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: transform .2s ease, background .2s ease;
    }

    .choice[hidden] {
      display: none;
    }

    .choice:hover {
      transform: translateY(-2px);
      background: #87304f;
    }

    .choice.no {
      background: transparent;
      color: var(--berry);
      transition: left .24s ease, top .24s ease, transform .22s ease, opacity .22s ease, background .2s ease;
    }

    .choice.no.running-away {
      position: fixed;
      z-index: 8;
      margin: 0;
    }

    .choice.no:hover {
      background: rgba(166, 61, 98, .08);
    }

    .choice.no.vanishing {
      opacity: 0;
      pointer-events: none;
    }

    .response {
      min-height: 24px;
      margin: 16px 0 0;
      color: var(--berry);
      font-size: 17px;
      font-style: italic;
    }

    @keyframes twinkle {
      from { opacity: .35; transform: scale(.85) rotate(-8deg); }
      to { opacity: .9; transform: scale(1.15) rotate(8deg); }
    }

    @keyframes grow {
      to { transform: scaleY(1); }
    }

    @keyframes envelope-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-9px); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="garden" aria-hidden="true">
    <div class="tulip" style="--x: 2%; --height: 250px; --bloom: #84b7ef; --delay: .1s">
      <span class="stem"></span><span class="leaf leaf-one"></span><span class="leaf leaf-two"></span>
      <span class="bloom"><span class="petal petal-left"></span><span class="petal petal-right"></span><span class="petal petal-center"></span></span>
    </div>
    <div class="tulip" style="--x: 14%; --height: 340px; --bloom: #fffdf6; --delay: .45s">
      <span class="stem"></span><span class="leaf leaf-one"></span><span class="leaf leaf-two"></span>
      <span class="bloom"><span class="petal petal-left"></span><span class="petal petal-right"></span><span class="petal petal-center"></span></span>
    </div>
    <div class="tulip" style="--x: 28%; --height: 200px; --bloom: #f4cb63; --delay: .75s">
      <span class="stem"></span><span class="leaf leaf-one"></span><span class="leaf leaf-two"></span>
      <span class="bloom"><span class="petal petal-left"></span><span class="petal petal-right"></span><span class="petal petal-center"></span></span>
    </div>
    <div class="tulip" style="--x: 69%; --height: 230px; --bloom: #fffdf6; --delay: .3s">
      <span class="stem"></span><span class="leaf leaf-one"></span><span class="leaf leaf-two"></span>
      <span class="bloom"><span class="petal petal-left"></span><span class="petal petal-right"></span><span class="petal petal-center"></span></span>
    </div>
    <div class="tulip" style="--x: 82%; --height: 325px; --bloom: #79aeea; --delay: .6s">
      <span class="stem"></span><span class="leaf leaf-one"></span><span class="leaf leaf-two"></span>
      <span class="bloom"><span class="petal petal-left"></span><span class="petal petal-right"></span><span class="petal petal-center"></span></span>
    </div>
    <div class="tulip" style="--x: 94%; --height: 270px; --bloom: #f4cb63; --delay: .9s">
      <span class="stem"></span><span class="leaf leaf-one"></span><span class="leaf leaf-two"></span>
      <span class="bloom"><span class="petal petal-left"></span><span class="petal petal-right"></span><span class="petal petal-center"></span></span>
    </div>
    <div class="tulip" style="--x: 8%; --height: 180px; --bloom: #f4cb63; --delay: .2s">
      <span class="stem"></span><span class="leaf leaf-one"></span><span class="leaf leaf-two"></span>
      <span class="bloom"><span class="petal petal-left"></span><span class="petal petal-right"></span><span class="petal petal-center"></span></span>
    </div>
    <div class="tulip" style="--x: 21%; --height: 270px; --bloom: #79aeea; --delay: .55s">
      <span class="stem"></span><span class="leaf leaf-one"></span><span class="leaf leaf-two"></span>
      <span class="bloom"><span class="petal petal-left"></span><span class="petal petal-right"></span><span class="petal petal-center"></span></span>
    </div>
    <div class="tulip" style="--x: 37%; --height: 165px; --bloom: #fffdf6; --delay: .8s">
      <span class="stem"></span><span class="leaf leaf-one"></span><span class="leaf leaf-two"></span>
      <span class="bloom"><span class="petal petal-left"></span><span class="petal petal-right"></span><span class="petal petal-center"></span></span>
    </div>
    <div class="tulip" style="--x: 43%; --height: 240px; --bloom: #f4cb63; --delay: 1.05s">
      <span class="stem"></span><span class="leaf leaf-one"></span><span class="leaf leaf-two"></span>
      <span class="bloom"><span class="petal petal-left"></span><span class="petal petal-right"></span><span class="petal petal-center"></span></span>
    </div>
    <div class="tulip" style="--x: 50%; --height: 150px; --bloom: #84b7ef; --delay: 1.3s">
      <span class="stem"></span><span class="leaf leaf-one"></span><span class="leaf leaf-two"></span>
      <span class="bloom"><span class="petal petal-left"></span><span class="petal petal-right"></span><span class="petal petal-center"></span></span>
    </div>
    <div class="tulip" style="--x: 57%; --height: 295px; --bloom: #fffdf6; --delay: 1.55s">
      <span class="stem"></span><span class="leaf leaf-one"></span><span class="leaf leaf-two"></span>
      <span class="bloom"><span class="petal petal-left"></span><span class="petal petal-right"></span><span class="petal petal-center"></span></span>
    </div>
    <div class="tulip" style="--x: 63%; --height: 200px; --bloom: #79aeea; --delay: .35s">
      <span class="stem"></span><span class="leaf leaf-one"></span><span class="leaf leaf-two"></span>
      <span class="bloom"><span class="petal petal-left"></span><span class="petal petal-right"></span><span class="petal petal-center"></span></span>
    </div>
    <div class="tulip" style="--x: 75%; --height: 160px; --bloom: #f4cb63; --delay: .7s">
      <span class="stem"></span><span class="leaf leaf-one"></span><span class="leaf leaf-two"></span>
      <span class="bloom"><span class="petal petal-left"></span><span class="petal petal-right"></span><span class="petal petal-center"></span></span>
    </div>
    <div class="tulip" style="--x: 89%; --height: 240px; --bloom: #fffdf6; --delay: 1s">
      <span class="stem"></span><span class="leaf leaf-one"></span><span class="leaf leaf-two"></span>
      <span class="bloom"><span class="petal petal-left"></span><span class="petal petal-right"></span><span class="petal petal-center"></span></span>
    </div>
    <div class="tulip" style="--x: 5%; --height: 140px; --bloom: #fffdf6; --delay: 1.25s">
      <span class="stem"></span><span class="leaf leaf-one"></span><span class="leaf leaf-two"></span>
      <span class="bloom"><span class="petal petal-left"></span><span class="petal petal-right"></span><span class="petal petal-center"></span></span>
    </div>
    <div class="tulip" style="--x: 33%; --height: 280px; --bloom: #84b7ef; --delay: 1.5s">
      <span class="stem"></span><span class="leaf leaf-one"></span><span class="leaf leaf-two"></span>
      <span class="bloom"><span class="petal petal-left"></span><span class="petal petal-right"></span><span class="petal petal-center"></span></span>
    </div>
    <div class="tulip" style="--x: 73%; --height: 255px; --bloom: #f4cb63; --delay: 1.75s">
      <span class="stem"></span><span class="leaf leaf-one"></span><span class="leaf leaf-two"></span>
      <span class="bloom"><span class="petal petal-left"></span><span class="petal petal-right"></span><span class="petal petal-center"></span></span>
    </div>
    <div class="tulip" style="--x: 91%; --height: 150px; --bloom: #79aeea; --delay: 2s">
      <span class="stem"></span><span class="leaf leaf-one"></span><span class="leaf leaf-two"></span>
      <span class="bloom"><span class="petal petal-left"></span><span class="petal petal-right"></span><span class="petal petal-center"></span></span>
    </div>
  </div>
  <main class="scene">
    <span class="sparkle sparkle-one" aria-hidden="true">✦</span>
    <span class="sparkle sparkle-two" aria-hidden="true">✧</span>
    <span class="sparkle sparkle-three" aria-hidden="true">✦</span>

    <button class="envelope-button" id="envelopeButton" type="button" aria-expanded="false" aria-label="Open the birthday envelope">
      <span class="envelope">
        <span class="letter">
          <span>
            <h1><span class="intro">It’s my birthday today…</span><em>Will you go on a date with me?</em></h1>
            <small>A little birthday invitation</small>
          </span>
        </span>
        <span class="back-fold"></span>
        <span class="front-left"></span>
        <span class="front-right"></span>
        <span class="front-bottom"></span>
        <span class="flap"></span>
        <span class="seal"><span>♥</span></span>
      </span>
      <span class="tap-hint">Tap the envelope to open</span>
    </button>

    <section class="answer" id="answer" aria-live="polite">
      <p>What do you say?</p>
      <div class="choices">
        <a class="choice" id="yesButton" href="love-you.html">Yes, let’s go! 💗</a>
        <button class="choice no" id="noButton" type="button">I can’t, sorry</button>
      </div>
      <p class="response" id="response"></p>
    </section>
  </main>

  <script>
    const envelopeButton = document.getElementById("envelopeButton");
    const answer = document.getElementById("answer");
    const response = document.getElementById("response");
    const noButton = document.getElementById("noButton");
    const dodgeSpots = [[.05, .18], [.78, .28], [.08, .74], [.78, .72], [.42, .12]];
    let noAttempts = 0;

    envelopeButton.addEventListener("click", () => {
      const isOpen = envelopeButton.classList.toggle("open");
      envelopeButton.setAttribute("aria-expanded", String(isOpen));
      answer.classList.toggle("visible", isOpen);
    });

    noButton.addEventListener("click", () => {
      noAttempts += 1;
      const [x, y] = dodgeSpots[noAttempts - 1];
      const maxLeft = window.innerWidth - noButton.offsetWidth - 12;
      const maxTop = window.innerHeight - noButton.offsetHeight - 12;
      noButton.classList.add("running-away");
      noButton.style.left = `${Math.max(12, Math.min(Math.round(window.innerWidth * x), maxLeft))}px`;
      noButton.style.top = `${Math.max(12, Math.min(Math.round(window.innerHeight * y), maxTop))}px`;
      noButton.style.transform = "none";

      if (noAttempts === dodgeSpots.length) {
        noButton.classList.add("vanishing");
        noButton.disabled = true;
        response.textContent = "That’s okay—thank you for being honest. 💛";
        window.setTimeout(() => {
          noButton.hidden = true;
        }, 250);
        return;
      }

      response.textContent = `You almost caught me! (${noAttempts}/5)`;
    });
  </script>
</body>
</html>
